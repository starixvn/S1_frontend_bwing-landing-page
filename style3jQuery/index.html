			async function usernameCheck () {
				let checked = true;
				let msg = "";
				let val = $("#input-username").val();
				if (val === "") {
					checked = false;
					msg = "Tên đăng nhập là bắt buộc.";
				} else if (val !== "") {
					if (val.length < 6 || val.length > 18) {
						checked = false;
						msg = "Tên đăng nhập phải có 6 đến 18 ký tự";
					}
					//  else if ((await nameRepeatCheck(val)) === false) {
					// 	checked = false;
					// 	msg = "Tên đăng nhập này đã được sử dụng.";
					// } else if ((await nameRepeatCheck(val)) === true) {
					// 	checked = true;
					// 	msg = "";
					// }
				}
				$("#tip-username").html(msg);
				return { checked, msg };
			};

			function passwordCheck(){
				let checked = false;
				let msg = "";
				let val = $("#input-password").val();
				let regx = /^[a-zA-Z0-9@$*!%#?&]*$/;
				if (val === "") {
					checked = false;
					msg = "Mật khẩu là bắt buộc";
				} else if (val !== null) {
					if (val.length < 6 || val.length > 18) {
						checked = false;
						msg = "Mật khẩu phải có 6 đến 18 ký tự";
					} else if (!regx.test(val)) {
						checked = false;
						msg = "6-18 ký tự chữ và số (A-Z, a-z, 0-9) hoặc Ký tự đặc biệt @$*!%#?&";
					} else {
						checked = true;
					}
				}
				$("#tip-password").html(msg);
				return { checked, msg };
			};

			async function clickSubmit (e) {
				let val_username = $("#input-username").val();
				let val_password = $("#input-password").val();
				let _usernameCheck = await usernameCheck();
				let _passwordCheck = passwordCheck();
				let checked = _usernameCheck.checked && _passwordCheck.checked 

				$('input[name=UserName]').val(val_username);
				$('input[name=Userpwd]').val(val_password);

				if (!checked) {
					$("#tip-username").html(_usernameCheck.msg);
					$("#tip-password").html(_passwordCheck.msg);
				} else {
					$("#submitForm").submit();
				}
			};
